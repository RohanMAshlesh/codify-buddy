name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js search "context index" -n 3
          # No API key in CI, so doctor reports a failed check; assert it runs and emits valid JSON.
          node dist/cli.js doctor --offline --json > doctor.json || true
          node -e "const c = JSON.parse(require('fs').readFileSync('doctor.json', 'utf8')); if (!c.some((x) => x.name === 'Index' && x.status === 'ok')) process.exit(1)"
          node dist/cli.js demo "$RUNNER_TEMP/demo" --replay --fast
        shell: bash
        env:
          CODIFY_HOME: ${{ runner.temp }}/codify-home
